# Меню и данные кофейни «Ягода» (взято с coffee-site). Цены в рублях, целые числа.
# При первом запуске бот переносит всё это в базу; дальше цены и стоп-лист правятся
# в админке бота (/admin), а новые позиции подхватываются из этого файла по id.

[shop]
name = "Кофейня Ягода"
address = "ул. Садовая, 24, вход со двора"
phone = "+7 (900) 123-45-67"
hours = "пн–чт 8:00–21:00, пт 8:00–22:00, сб 9:00–22:00, вс 9:00–20:00"
timezone = "Europe/Moscow"
about = "Небольшая кофейня: свежая обжарка, воронка и эспрессо-бар, выпечка каждое утро. Заказывайте здесь — заберёте без очереди."

